name: Deploy docs

on:
  push:
    branches: [main]
  # Hourly (at :17, away from GitHub's busy top of the hour): the GitHub docs and Project Status data
  # aren't committed, so re-deploying is how the public site picks up their changes
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Public content only: GitHub repo docs and wikis, then Project Status without the private
      # project board (PUBLIC_BUILD). Drive, Box and Figma are local-only, so they're simply absent here.
      - run: npm run sync:readmes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher rate limit; only sees public repos of the org
      # Test logs parsed by earlier deploys, so each hourly run only downloads logs of new runs
      - uses: actions/cache@v4
        with:
          path: docs/project-status/_data
          key: status-data-${{ github.run_id }}
          restore-keys: status-data-
      - run: npm run sync:status
        env:
          PUBLIC_BUILD: '1'
          # Optional STATUS_GITHUB_TOKEN secret (a token with public read access) if the default token
          # can't read another org's Actions logs; without them the Integration Tests page has no test details.
          GITHUB_TOKEN: ${{ secrets.STATUS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          LIVE_API_URL: '' # no live GitHub data on the public site (there's no server to hold the token)
          CHAT_API_URL: '' # no chat box on the public site (it needs your local Claude Code CLI)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
