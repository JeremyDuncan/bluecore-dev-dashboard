# The docs site, plus the two APIs the pages use, on ONE address (so it also works through
# a tunnel like ngrok):
#   /api/live/  → MCP container: live GitHub data for the Project Status pages
#   /api/chat/  → "Ask the docs" chat helper running on this machine (outside Docker)

# The host part of the browser's Origin header ("https://x.ngrok-free.app" → "x.ngrok-free.app")
map $http_origin $origin_host {
  default "";
  "~^https?://(?<h>[^/:]+)(:[0-9]+)?$" $h;
}

server {
  listen 80;
  absolute_redirect off; # keep the host port (e.g. 8080) in any redirects
  root /usr/share/nginx/html;

  # Docker's DNS, looked up per request: the site still starts if mcp-prod or the chat helper isn't running
  resolver 127.0.0.11 valid=30s ipv6=off;

  location / {
    # Docusaurus emits /page/index.html; also accept /page.html and fall back to the site's 404.
    try_files $uri $uri/index.html $uri.html =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/live/ {
    set $live http://mcp-prod:3001;
    rewrite ^/api/live/(.*)$ /api/$1 break;
    proxy_pass $live;
    proxy_set_header Host localhost; # the MCP server only answers requests addressed to localhost
  }

  location /api/chat/ {
    # Only pages of this site may use the chat: a browser always sends Origin with a POST,
    # so a request from any other website is refused here.
    set $other_site 0;
    if ($http_origin != "") {
      set $other_site 1;
    }
    if ($origin_host = $host) {
      set $other_site 0;
    }
    if ($other_site) {
      return 403;
    }

    set $chat http://host.docker.internal:3002;
    rewrite ^/api/chat/(.*)$ /$1 break;
    proxy_pass $chat;
    proxy_set_header Host localhost; # the chat helper only answers requests addressed to localhost
    proxy_set_header Origin "";      # checked above
    # Answers stream as server-sent events: don't buffer, allow long answers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  error_page 404 /404.html;
}
